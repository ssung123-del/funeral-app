<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장례 안내 문자 생성기</title>
  <script>
    const themeKey = "funeral-app-theme";
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
    let themeChoice = "system";
    try {
      const saved = localStorage.getItem(themeKey);
      if (saved === "light" || saved === "dark") themeChoice = saved;
    } catch { /* The setting still works for this visit when storage is unavailable. */ }

    function applyTheme() {
      document.documentElement.dataset.theme = themeChoice === "system"
        ? (systemDark.matches ? "dark" : "light") : themeChoice;
    }
    applyTheme();
    systemDark.addEventListener("change", applyTheme);
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f0e6;
      --grid: #ada79526;
      --control: #b5b0a4;
      --placeholder: #67645e;
      --focus: #197278;
      --outline: #b8b4a9;
      --chip: #e4e1d8;
      --shadow: #302c2010;
      --on-pine: white;
      --ink: #161614;
      --muted: #5e5c56;
      --line: #d0cabe;
      --paper: #faf8f0;
      --soft: #eeebe2;
      --pine: #07545a;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #151817;
      --grid: #d4e1da0e;
      --paper: #202524;
      --soft: #2b3230;
      --ink: #f1f2e9;
      --muted: #c1c7bd;
      --line: #505955;
      --control: #82918a;
      --outline: #819189;
      --placeholder: #acb6af;
      --pine: #8edbd5;
      --on-pine: #102e2c;
      --focus: #b4fff5;
      --chip: #38443e;
      --shadow: #00000030;
    }
    .theme-picker { display:flex; align-items:center; gap:10px; margin-top:16px; }
    .theme-picker label { color:var(--muted); margin:0; font-weight:500; }
    .theme-picker select { width:auto; height:38px; font-size:.9rem; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-image: linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: max(64px, calc(100vw / 12)) 100%;
    }
    .app-shell { width: min(calc(100% - 80px), 1184px); margin: 56px auto 72px;
      display: grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 1.7fr);
      align-items: start; gap: clamp(28px, 5vw, 76px); }
    .masthead { position: sticky; top: 40px; padding: 18px 0 0; border-top: 2px solid var(--ink); }
    h1, h2, h3, summary { margin: 0; line-height: 1.35; letter-spacing: -.035em; }
    h1 { font-size: clamp(2.85rem, 4.7vw, 4.5rem); font-weight: 800; line-height: 1.08; letter-spacing: -.075em; }
    h1 span { display: block; }
    .workspace { min-width: 0; }
    .task-links { display: grid; margin-top: 36px; border-top: 1px solid var(--line); }
    .task-links a { display: flex; align-items:center; justify-content:space-between; padding: 13px 1px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 650; }
    .task-links a::after { content: "↘"; color: var(--pine); }
    .task-links a:hover { color: var(--pine); }
    h2, summary { font-size: 1.22rem; font-weight: 700; }
    h3 { font-size: 1rem; }
    .subtitle { word-break: keep-all; margin: 7px 0 0; color: var(--muted); line-height: 1.55; }
    .card { background: var(--paper); padding: 28px 32px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 5px; box-shadow: 0 2px 4px var(--shadow); scroll-margin-top: 16px; }
    .card > h2 { margin-bottom: 20px; }
    .block-title { margin: 26px 0 16px; padding-top: 22px; border-top: 1px solid var(--line); }
    .top-fields, .person-wrap, .inline-2, #vehicleForm { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 18px; }
    .top-fields { align-items: end; }
    .top-fields .field, .person-wrap .field, #vehicleForm .field { margin: 0; }
    .segmented { display: flex; height:44px; border-bottom: 1px solid var(--line); }
    button, input, select, textarea { font: inherit; }
    button, summary { cursor: pointer; }
    button { border: 1px solid transparent; border-radius: 4px; font-weight: 600; }
    .seg-btn { flex: 1; padding: 8px 4px; color: var(--muted); background: transparent; }
    .seg-btn { border-radius: 0; }
    .seg-btn.active { color: var(--pine); border-bottom: 3px solid var(--pine); }
    .primary-btn { background: var(--pine); color: var(--on-pine); }
    .field { margin-bottom: 16px; }
    label, .field-label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 600; color: var(--ink); }
    label i { display:none; }
    input, select, textarea { width: 100%; min-width: 0; height: 44px; padding: 9px 11px; background: var(--paper); border: 1px solid var(--control); border-radius: 4px; color: var(--ink); }
    input::placeholder { color: var(--placeholder); font-weight: 400; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    select:disabled { opacity: 1; color: var(--pine); background: var(--soft); }
    .name-row { display:grid; grid-template-columns: minmax(0,1fr) 6.2em; gap: 6px; }
    .hint-tag { align-self: end; color: var(--muted); font-size: .85rem; }
    .family-actions { margin-top: 16px; }
    .overlap-head, .overlap-top, .result-meta, .result-headline, .schedule-title { display:flex; align-items:center; gap: 8px; }
    .overlap-head h3, .schedule-title h2 { margin-right: auto; }
    .overlap-head select, .overlap-top select { flex:1; width: auto; min-width: 0; }
    .outline-btn, .copy-btn, .delete-btn, .ghost-btn { color: var(--pine); border-color: var(--outline); background: var(--paper); padding: 9px 12px; }
    .outline-btn, .delete-btn, .copy-btn { flex: none; font-size: .86rem; }
    .remove-event, .delete-btn { color: var(--muted); }
    .schedule-box, .overlap-card, .result-box { margin: 10px 0; padding: 16px; border-radius: 5px; border: 1px solid var(--line); background: var(--soft); }
    .schedule-box .inline-2, .overlap-top { margin: 12px 0; }
    .overlap-card .field:last-child { margin-bottom: 0; }
    .check-line { display:flex; align-items:center; gap:8px; min-height: 36px; margin: 0 0 6px; cursor:pointer; }
    .check-line input { width: 18px; height: 18px; margin:0; accent-color: var(--pine); }
    .schedule-title .check-line { margin: 0; }
    .inline-2 label { margin: 0; }
    .inline-2 input { margin-top: 5px; }
    .inline-2 label:has(input[hidden]) { display:none; }
    #addSchedule, #addDetailSchedule { margin-bottom: 18px; }
    .primary-btn, .ghost-btn { width: 100%; padding: 13px; margin-top: 8px; }
    button:hover { filter: brightness(.96); }
    .result-meta { justify-content: space-between; flex-wrap:wrap; margin-bottom: 10px; }
    .result-headline { flex-wrap:wrap; }
    .result-title { font-weight: 700; }
    .byte-chip, .badge-chip { color: var(--muted); font-size: .8rem; }
    .badge-chip { padding: 3px 6px; border-radius: 4px; background: var(--chip); }
    .result-box.success { border-left: 3px solid var(--pine); }
    .result-text, .auto-hall-text { margin:0; font: inherit; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
    details.card summary { color: var(--pine); }
    #vehicleForm { margin-top:20px; }
    #loadNews { margin:16px 0; }
    #vehicleForm button, #tripField { grid-column: 1/-1; }
    #vehicleResult .copy-btn { display:block; margin:0 0 12px auto; }
    .hidden, [hidden] { display:none !important; }
    @media (max-width: 880px) {
      .app-shell { display:block; width:min(calc(100% - 48px), 700px); margin:28px auto 48px; }
      .masthead { position:static; margin-bottom:16px; padding:18px 0 0; }
      .task-links { display:flex; gap:14px; margin-top:18px; }
      .task-links a { flex:1; font-size:.92rem; gap:4px; }
      h1 span { display:inline; }
    }
    @media (max-width: 580px) {
      .app-shell { width: calc(100% - 24px); margin:20px auto 32px; }
      .masthead { padding:16px 0 0; }
      h1 { font-size:clamp(2.15rem, 8.7vw, 3rem); }
      .card { padding:20px 16px; }
      .person-wrap, #vehicleForm { grid-template-columns: minmax(0,1fr); }
      .top-fields { gap:10px; }
      .schedule-box, .overlap-card { padding:12px; }
      .inline-2 { gap:8px; }
      input, select { font-size:16px; }
    }
    @media (max-width: 380px) {
      .inline-2 { grid-template-columns: minmax(0,1fr); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <h1><span>장례 안내</span> <span>문자 생성기</span></h1>
      <nav class="task-links" aria-label="작성할 문구 선택">
        <a href="#funeral">장례문자</a>
        <a href="#step2Section">교우소식</a>
        <a href="#vehicle">차량신청</a>
      </nav>
      <div class="theme-picker">
        <label for="themeChoice">화면 모드</label>
        <select id="themeChoice">

    </header>
    <div class="workspace">
    <section class="card" id="funeral">

      <div class="segmented" role="group" aria-label="모드 선택">

        <button type="button" class="seg-btn" data-mode="church">교회장</button>
      </div>

        </div>
      <div class="field">
        <label for="districtName"><i class="ri-map-pin-user-line"></i>교구</label>
        <input id="districtName" type="text" required>
      </div>

      </div>
      <h2 class="block-title">교인 정보</h2>
      <div class="person-wrap">

          <label for="name1">이름/직분</label>
          <div class="row name-row">
            <input id="name1" type="text" placeholder="이름 (예: 홍길동)">
            <select id="title1"></select>
          </div>

        <div class="field">
          <label for="name2">배우자/직분</label>
          <div class="row name-row">
            <input id="name2" type="text" placeholder="배우자 (없으면 빈칸)">
            <select id="title2"></select>
          </div>
        </div>

        <div class="field" id="relationField">
          <label for="relation"><i class="ri-link-m"></i>관계</label>

        </div>

      </div>

      <div class="family-actions">

          <h3>추가 유가족 · 겹장</h3>
          <button type="button" id="addOverlapBtn" class="outline-btn">유가족 추가</button>
        </div>
        <div id="overlapList" class="overlap-list"></div>
      </div>
      <div class="schedule-title block-title"><h2>장례 일정</h2>
      <label class="check-line"><input id="individualVisit" type="checkbox"> 개별조문</label>
      </div>
      <div id="schedules"></div>
      <button type="button" id="addSchedule" class="outline-btn">일정 추가</button>

      <div class="field">
        <label for="funeralHall"><i class="ri-hospital-line"></i>장례식장</label>
        <input id="funeralHall" type="text" placeholder="예: OO병원장례식장3호 또는 무빈소">
      </div>

      <button type="button" id="generateBtn" class="primary-btn">문자 생성하기</button>
    </section>

    <section id="resultSection" class="card hidden">
      <h2>장례문자 결과</h2>
      <div id="resultBoxes" class="result-list" aria-live="polite"></div>
      <button type="button" id="openStep2Btn" class="ghost-btn">교우소식(상세) 작성하기</button>
      <button type="button" id="openVehicle" class="ghost-btn">차량신청 작성하기</button>
    </section>

    <details id="step2Section" class="card">
      <summary>교우소식 작성하기</summary>
      <button id="loadNews" type="button" class="outline-btn">장례문자 입력값 가져오기</button>

      <div class="field">
        <label for="step2Header">교우소식 제목</label>
        <input id="step2Header" type="text">
      </div>

      <label class="check-line"><input id="detailVisit" type="checkbox"> 개별조문</label>
      <div id="detailSchedules"></div>
      <button type="button" id="addDetailSchedule" class="outline-btn">일정 추가</button>
      <div class="field" style="margin-top: 12px;">
        <label for="newsHall">빈소</label>
        <input id="newsHall" type="text">
      </div>

      <div class="field">
        <label for="step2Cemetery">장지</label>
        <input id="step2Cemetery" type="text" placeholder="장지 입력">
      </div>

      <button type="button" id="generateStep2Btn" class="primary-btn">상세 문구 생성하기</button>

      <div id="step2OutputWrap" class="result-box hidden" style="margin-top: 12px;">
        <div class="result-meta">
          <div class="result-headline">
            <span class="result-title">상세 결과</span>
          </div>

        </div>
        <pre id="step2Output" class="result-text"></pre>
      </div>
    </details>
    <details class="card" id="vehicle">
      <summary>차량신청 작성하기</summary>
      <form id="vehicleForm">
        <div class="field hidden" id="tripField">
          <label for="trip">교회출발 일정</label>
          <select id="trip"><option value="">직접 입력</option></select>
        </div>
        <div class="field">
          <label for="vehicle-date">날짜</label>
          <input id="vehicle-date" name="date" type="date"  required>
        </div>
        <div class="field">
          <label for="vehicle-departure">교회출발시간</label>
          <input id="vehicle-departure" name="departure" type="text" placeholder="오후 5:30" required>
        </div>
        <div class="field">
          <label for="vehicle-arrival">도착시간</label>
          <input id="vehicle-arrival" name="arrival" type="text" placeholder="오후 7:30" required>
        </div>
        <div class="field">
          <label for="vehicle-department">사용부서</label>
          <input id="vehicle-department" name="department" type="text" required>
        </div>
        <div class="field">
          <label for="vehicle-passengers">탑승인원(명)</label>
          <input id="vehicle-passengers" name="passengers" type="number" min="1" step="1" required>
        </div>
        <div class="field">
          <label for="vehicle-purpose">사용목적</label>
          <input id="vehicle-purpose" name="purpose" type="text" value="장례예배" required>
        </div>
        <div class="field">
          <label for="vehicle-destination">행선지</label>
          <input id="vehicle-destination" name="destination" type="text" placeholder="장례식장 이름" required>
        </div>
        <div class="field">
          <label for="vehicle-applicant">신청인</label>
          <input id="vehicle-applicant" name="applicant" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="vehicle-phone">연락처</label>

        <button type="button" class="copy-btn" id="copyVehicle">복사하기</button>
        <pre class="result-text" id="vehicleText"></pre>
      </div>
    </details>
    </div>
  </main>

  <script>
    const weekdayMap = ["주일", "월", "화", "수", "목", "금", "토"];
    const titleOptionsMain = [
      { value: "", text: "직분" },
      { value: "성도", text: "성도" },
      { value: "집사", text: "집사" },
      { value: "안수집사", text: "안수" },
      { value: "권사", text: "권사" },
      { value: "장로", text: "장로" },
      { value: "목사", text: "목사" },
      { value: "전도사", text: "전도사" }
    ];
    const titleOptionsSpouse = titleOptionsMain;
    let currentMode = "district";
    let overlapId = 0;
    let newsEdited = false;
    let newsSource = null;

    const els = {
      segButtons: document.querySelectorAll(".seg-btn"),
      districtName: document.getElementById("districtName"),
      name1: document.getElementById("name1"),
      title1: document.getElementById("title1"),
      name2: document.getElementById("name2"),
      title2: document.getElementById("title2"),
      relationField: document.getElementById("relationField"),
      relation: document.getElementById("relation"),
      goTag: document.getElementById("goTag"),
      individualVisit: document.getElementById("individualVisit"),
      addOverlapBtn: document.getElementById("addOverlapBtn"),
      overlapList: document.getElementById("overlapList"),
      funeralHall: document.getElementById("funeralHall"),
      generateBtn: document.getElementById("generateBtn"),
      resultSection: document.getElementById("resultSection"),
      resultBoxes: document.getElementById("resultBoxes"),
      openStep2Btn: document.getElementById("openStep2Btn"),
      step2Section: document.getElementById("step2Section"),
      step2Header: document.getElementById("step2Header"),
      newsHall: document.getElementById("newsHall"),
      step2Cemetery: document.getElementById("step2Cemetery"),
      generateStep2Btn: document.getElementById("generateStep2Btn"),
      step2OutputWrap: document.getElementById("step2OutputWrap"),
      step2Output: document.getElementById("step2Output"),
      copyStep2Btn: document.getElementById("copyStep2Btn")
    };

    function buildSelectOptions(selectEl, options) {
      selectEl.innerHTML = options
        .map((item) => `<option value="${item.value}">${item.text}</option>`)
        .join("");
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) {
        return null;
      }
      const [yy, mm, dd] = dateStr.split("-").map(Number);
      if (!yy || !mm || !dd) {
        return null;
      }
      return new Date(yy, mm - 1, dd);
    }

    function normalizeDistrictName(value) {
      return (value || "").replace(/교구/g, "").trim();
    }

    function sanitizeRelation(value) {
      return (value || "").replace(/소천/g, "").trim();
    }

    function formatDate(dateStr) {
      const target = parseLocalDate(dateStr);
      if (!target) {
        return "";
      }
      const today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Seoul" }).format(new Date());
      const isToday = dateStr === today;
      if (isToday) {
        return `${target.getDate()}일(오늘)`;
      }
      return `${target.getDate()}일(${weekdayMap[target.getDay()]})`;
    }

    function formatLongDate(dateStr) {
      const target = parseLocalDate(dateStr);
      if (!target) {
        return "";
      }
      return `${target.getMonth() + 1}월 ${target.getDate()}일(${weekdayMap[target.getDay()]})`;
    }

    function normalizeTime(value, kind) {
      const raw = value.trim().replace(/\s+/g, "");
      if (!raw) return "";
      const match = /^(오전|오후)(\d{1,2})(?::(\d{1,2})|시(?:(\d{1,2})분?|반)?)?$/.exec(raw);
      if (match) {
        const [, period, hours, colonMinutes, koreanMinutes] = match;
        let hour = Number(hours);
        const minute = raw.endsWith("반") ? 30 : Number(colonMinutes || koreanMinutes || 0);
        if (hour >= 1 && hour <= 12 && minute < 60) {
          hour = hour % 12 + (period === "오후" ? 12 : 0);
          return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
        }
      }
      throw new Error(kind + " 시간은 오전 또는 오후와 함께 1~12시로 입력해 주세요. 예: 오후 2시 30분");
    }

    function parseTime(input) {
      if (!input) return null;
      const [hour, minute] = input.split(":").map(Number);
      return { period: hour >= 12 ? "오후" : "오전", hour: hour % 12 || 12, minute };
    }

    function formatTime(timeObj) {
      if (!timeObj) {
        return "";
      }
      if (timeObj.minute === 0) {
        return `${timeObj.period}${timeObj.hour}시`;
      }
      return `${timeObj.period}${timeObj.hour}:${String(timeObj.minute).padStart(2, "0")}`;
    }

    function formatTimeLong(timeObj) {
      if (!timeObj) {
        return "";
      }
      if (timeObj.minute === 0) {
        return `${timeObj.period} ${timeObj.hour}시`;
      }
      return `${timeObj.period} ${timeObj.hour}:${String(timeObj.minute).padStart(2, "0")}`;
    }

    function buildPersonName(name1, title1, name2, title2) {
      const n1 = (name1 || "").trim();
      const t1 = title1 || "";
      const n2 = (name2 || "").trim();
      const t2 = title2 || "";
      if (!n2) {
        return `${n1}${t1}`;
      }
      if (t1 === t2) {
        return `${n1}(${n2})${t1}`;
      }
      return `${n1}${t1}(${n2}${t2})`;
    }

    function countBytes(text) {
      return [...text].reduce((total, char) => total + (char.charCodeAt(0) < 128 ? 1 : 2), 0);
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        alert("복사되었습니다!");
      } catch (error) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        alert("복사되었습니다!");
      }
    }

    function makeResultBox({ title, content, tone }) {
      const box = document.createElement("article");
      const bytes = countBytes(content);
      const smsType = bytes <= 90 ? "SMS" : "LMS";
      box.className = `result-box ${tone || ""}`;
      box.innerHTML = `
        <div class="result-meta">
          <div class="result-headline">
            <span class="result-title">${escapeHtml(title)}</span>
            <span class="byte-chip">${bytes} Byte</span>
            <span class="badge-chip ${smsType.toLowerCase()}">${smsType}</span>
          </div>
          <button type="button" class="copy-btn">복사하기</button>
        </div>
        <pre class="result-text">${escapeHtml(content)}</pre>
      `;
      box.querySelector(".copy-btn").addEventListener("click", () => copyText(content));
      return box;
    }

    function renderResultBoxes(items) {
      els.resultBoxes.innerHTML = "";
      items.forEach((item) => {
        els.resultBoxes.appendChild(makeResultBox(item));
      });
      els.resultSection.classList.remove("hidden");
      els.resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function collectOverlapData() {
      const cards = els.overlapList.querySelectorAll(".overlap-card");
      const results = [];
      cards.forEach((card) => {
        const type = card.querySelector(".j-type").value || "교구장";
        const district = normalizeDistrictName(card.querySelector(".j-district").value);
        const name1 = card.querySelector(".j-name1").value.trim();
        const title1 = card.querySelector(".j-title1").value;
        const name2 = card.querySelector(".j-name2").value.trim();
        const title2 = card.querySelector(".j-title2").value;
        const relation = sanitizeRelation(card.querySelector(".j-relation").value);

        if (!name1) throw new Error("추가한 유가족의 이름을 입력하거나 해당 줄을 삭제해 주세요.");

        results.push({
          type,
          district,
          personName: buildPersonName(name1, title1, name2, title2),
          relation
        });
      });
      return results;
    }

    function toggleMode(mode) {
      currentMode = mode;
      els.segButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
        btn.setAttribute("aria-pressed", String(btn.dataset.mode === mode));
      });
      const isDistrict = mode === "district";
      els.relationField.classList.toggle("hidden", !isDistrict);
      els.goTag.classList.toggle("hidden", isDistrict);
      for (const row of schedules.children) refreshKind(row, schedules);
    }

    const schedules = document.getElementById("schedules");
    const detailSchedules = document.getElementById("detailSchedules");
    const detailVisit = document.getElementById("detailVisit");

    function isIndividualVisit(container) {
      return (container === schedules ? els.individualVisit : detailVisit).checked;
    }

    function refreshKind(row, container) {
      const kind = row.querySelector(".kind");
      const locked = currentMode === "district" && !isIndividualVisit(container) && kind.value === "위로";
      kind.disabled = locked;
      row.querySelector(".change-kind").hidden = !locked;
    }

    function refreshDeparture(row, individual) {
      const checkbox = row.querySelector("[type=checkbox]");
      const time = row.querySelector(".event-time");
      time.hidden = individual && row.querySelector(".kind").value === "발인";
      time.disabled = time.hidden;
      checkbox.disabled = individual || !time.value.trim();
      checkbox.checked = !checkbox.disabled && checkbox.dataset.preferred !== "false";
      checkbox.parentElement.title = individual ? "개별조문은 교회출발을 표시하지 않습니다." :
        checkbox.disabled ? "출발 시각을 입력하면 선택할 수 있습니다." : "";
    }

    function addSchedule(container, data = {}) {
      const row = document.createElement("div");
      row.className = "schedule-box";
      row.innerHTML = `
        <div class="overlap-head">
          <select aria-label="일정 종류" class="kind">
            <option>위로</option><option>입관</option><option>천국환송</option><option>발인</option>
          </select>
          <button type="button" class="outline-btn change-kind" hidden>종류 변경</button>
          <button type="button" class="outline-btn remove-event">삭제</button>
        </div>
        <div class="row inline-2">
          <label>날짜<input type="date" aria-label="일정 날짜"></label>
          <label>시간<input type="text" class="event-time" aria-label="일정 시간 직접 입력 (선택)" placeholder="오후 2시 30분"></label>
        </div>
        <label class="check-line"><input type="checkbox"> 교회출발</label>
        <input class="place" aria-label="이 일정의 장소 또는 변경 안내" placeholder="이 일정의 장소 또는 변경 안내 (선택)">`;
      row.querySelector(".kind").value = data.kind || "위로";
      row.querySelector("[type=date]").value = data.date || "";
      row.querySelector(".event-time").value = formatTimeLong(parseTime(data.time));
      const depart = row.querySelector("[type=checkbox]");
      depart.dataset.preferred = String(data.preferDeparture ?? true);
      depart.addEventListener("change", () => { depart.dataset.preferred = String(depart.checked); });
      row.querySelector(".event-time").addEventListener("input", () => refreshDeparture(row, isIndividualVisit(container)));
      row.querySelector(".kind").addEventListener("change", () => refreshDeparture(row, isIndividualVisit(container)));
      refreshDeparture(row, isIndividualVisit(container));
      row.querySelector(".place").value = data.place || "";
      const kind = row.querySelector(".kind");
      const changeKind = row.querySelector(".change-kind");
      changeKind.onclick = () => {
        kind.disabled = false;
        changeKind.hidden = true;
        kind.focus();
      };
      kind.addEventListener("change", () => refreshKind(row, container));
      refreshKind(row, container);
      row.querySelector(".remove-event").onclick = () => row.remove();
      container.appendChild(row);
    }

    function readSchedules(container) {
      const events = [];
      for (const row of container.children) {
        const kind = row.querySelector(".kind").value;
        const date = row.querySelector("[type=date]").value;
        const time = isIndividualVisit(container) && kind === "발인" ? "" : normalizeTime(row.querySelector(".event-time").value, kind);
        const place = row.querySelector(".place").value.trim();
        if (!date && !time && !place) continue;
        if (!date) throw new Error(kind + " 날짜를 입력해 주세요.");
        const preferDeparture = row.querySelector("[type=checkbox]").dataset.preferred !== "false";
        const depart = !isIndividualVisit(container) && Boolean(time) && preferDeparture;
        events.push({ kind, date, time, place, depart, preferDeparture });
      }
      const order = ["위로", "입관", "천국환송", "발인"];
      return events.sort((a, b) => a.date.localeCompare(b.date) ||
        (a.time || "24:00").localeCompare(b.time || "24:00") ||
        order.indexOf(a.kind) - order.indexOf(b.kind));
    }

    function scheduleParts(events, detailed, departure = "교회출") {
      const parts = [];
      for (const event of events) {
        const time = parseTime(event.time);
        const start = time && event.depart;
        if (detailed) {
          const when = [formatLongDate(event.date), formatTimeLong(time), start ? "교회출발" : ""];
          parts.push(event.kind + ": " + when.filter(Boolean).join(" "));
        } else {
          parts.push(event.kind + ":" + formatDate(event.date) + formatTime(time) + (start ? departure : ""));
        }
        if (event.place) parts.push(event.place);
      }
      return parts;
    }

    function readFuneralInfo(requireComplete) {
      const church = currentMode === "church";
      const type = church ? "교회장" : "교구장";
      const district = normalizeDistrictName(els.districtName.value);
      if (requireComplete && !district) {
        els.districtName.focus();
        throw new Error("장례문자 제목에 표시할 교구를 입력해 주세요.");
      }
      const name = els.name1.value.trim().replace(/^故\s*/, "");
      const funeralHall = els.funeralHall.value.trim();
      if (requireComplete && (!name || !funeralHall)) throw new Error("이름과 빈소(또는 무빈소)를 입력해 주세요.");
      const relation = sanitizeRelation(els.relation.value);
      if (requireComplete && !church && !relation) throw new Error("교구장 문자에 표시할 고인과의 관계(예: 모친, 장남)를 입력해 주세요.");
      const family = collectOverlapData();
      const groups = new Map([[type, new Set([district])]]);
      for (const member of family) {
        if (!groups.has(member.type)) groups.set(member.type, new Set());
        groups.get(member.type).add(member.district || district);
      }
      const header = [...groups].map(([label, districts]) => {
        const separator = groups.size === 1 ? "/" : ",";
        return label + "-" + [...districts].join(separator);
      }).join("/");
      const person = buildPersonName(name, els.title1.value, els.name2.value, els.title2.value);
      const lead = church ? "故" + person : person + relation;
      const relatives = family.map(item => item.personName + item.relation);
      const individual = els.individualVisit.checked;
      const events = readSchedules(schedules);
      if (requireComplete && !events.length && !individual) throw new Error("안내할 일정의 날짜를 입력하거나 개별조문을 선택해 주세요.");
      const prefix = "[" + header + "]";
      const heading = district && name ? [[prefix, lead].join(" ") + " 소천", ...relatives].join(" / ") : "";
      return { church, prefix, lead, relatives, events, individual, funeralHall, heading };
    }

    function generateStep1() {
      try {
        const { church, prefix, lead, relatives, events, individual, funeralHall } = readFuneralInfo(true);
        const body = (departure, death) => [
          prefix + lead + death, ...relatives, ...(individual ? ["개별조문"] : []),
          ...scheduleParts(events, false, departure), funeralHall
        ].join("/");
        const message = body("교회출", "소천");
        const items = [{ title: "생성 결과", content: message }];
        if (!church && countBytes(message) > 90) {
          let shorter = body("교출", "소천");
          if (countBytes(shorter) > 90) shorter = body("교출", "");
          if (shorter !== message) items.push({ title: "단축안", content: shorter, tone: "success" });
        }
        renderResultBoxes(items);
      } catch (error) {
        alert(error.message);
      }
    }

    function loadNews(force = false) {
      if (newsEdited && !force) return;
      try {
        const data = readFuneralInfo(false);
        const source = JSON.stringify(data);
        if (!force && source === newsSource) return;
        els.step2Header.value = data.heading;
        detailVisit.checked = data.individual;
        detailSchedules.replaceChildren();
        if (data.events.length) data.events.forEach(event => addSchedule(detailSchedules, event));
        else addSchedule(detailSchedules, { kind: data.individual ? "발인" : "위로" });
        els.newsHall.value = data.funeralHall;
        els.step2OutputWrap.classList.add("hidden");
        newsSource = source;
        newsEdited = false;
      } catch (error) {
        if (force) alert(error.message);
        if (!detailSchedules.children.length) addSchedule(detailSchedules);
      }
    }

    function generateStep2() {
      try {
        const heading = els.step2Header.value.trim();
        const hall = els.newsHall.value.trim();
        if (!heading || !hall) throw new Error("교우소식 제목과 빈소를 입력해 주세요.");
        const lines = [heading, ""];
        if (detailVisit.checked) lines.push("개별조문");
        lines.push(...scheduleParts(readSchedules(detailSchedules), true));
        lines.push("빈소: " + hall);
        if (els.step2Cemetery.value.trim()) lines.push("장지: " + els.step2Cemetery.value.trim());
        els.step2Output.textContent = lines.join("\n");
        els.step2OutputWrap.classList.remove("hidden");
      } catch (error) {
        alert(error.message);
      }
    }

    function addOverlapCard() {
      overlapId += 1;
      const card = document.createElement("div");
      card.className = "overlap-card";
      card.dataset.id = String(overlapId);
      card.innerHTML = `
        <div class="overlap-top">
          <select class="j-type">
            <option value="교구장">교구장</option>
            <option value="교회장">교회장</option>
          </select>
          <button type="button" class="delete-btn" aria-label="겹장 삭제">삭제</button>
        </div>
        <div class="field">
          <input class="j-district" type="text" placeholder="교구 (비워 두면 대표 교구 적용)">
        </div>
        <div class="field">
          <div class="row name-row">
            <input class="j-name1" type="text" placeholder="이름">
            <select class="j-title1">${titleOptionsMain.map((item) => `<option value="${item.value}">${item.text}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field">
          <div class="row name-row">
            <input class="j-name2" type="text" placeholder="배우자">
            <select class="j-title2">${titleOptionsSpouse.map((item) => `<option value="${item.value}">${item.text}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field">
          <input class="j-relation" type="text" placeholder="관계">
        </div>
      `;
      card.querySelector(".delete-btn").addEventListener("click", () => {
        card.remove();
      });
      els.overlapList.appendChild(card);
    }

    function nextKind(container) {
      if (currentMode === "district" && !isIndividualVisit(container)) return "위로";
      const kinds = [...container.querySelectorAll(".kind")].map(field => field.value);
      const choices = isIndividualVisit(container) ? ["발인", "입관"] : ["위로", "입관", "천국환송", "발인"];
      return choices.find(kind => !kinds.includes(kind)) || choices[0];
    }

    function bindEvents() {
      els.segButtons.forEach((btn) => {
        btn.addEventListener("click", () => toggleMode(btn.dataset.mode));
      });
      for (const [visit, container] of [[els.individualVisit, schedules], [detailVisit, detailSchedules]]) {
        visit.addEventListener("change", () => {
          const row = container.firstElementChild;
          if (container.children.length === 1 && !row.querySelector("[type=date]").value &&
              !row.querySelector(".event-time").value && !row.querySelector(".place").value) {
            const kind = row.querySelector(".kind");
            if (kind.value === (visit.checked ? "위로" : "발인")) kind.value = visit.checked ? "발인" : "위로";
          }
          for (const item of container.children) {
            refreshKind(item, container);
            refreshDeparture(item, visit.checked);
          }
        });
      }
      document.getElementById("addSchedule").onclick = () => addSchedule(schedules, { kind: nextKind(schedules) });
      document.getElementById("addDetailSchedule").onclick = () => addSchedule(detailSchedules, { kind: nextKind(detailSchedules) });
      const invalidate = () => {
        els.resultSection.classList.add("hidden");
      };
      const form = els.generateBtn.closest("section");
      form.addEventListener("input", invalidate);
      form.addEventListener("click", event => {
        if (event.target.closest("button") && !event.target.closest("#generateBtn")) invalidate();
      }, true);
      const markNewsEdited = () => {
        newsEdited = true;
        els.step2OutputWrap.classList.add("hidden");
      };
      els.step2Section.addEventListener("input", markNewsEdited);
      document.getElementById("addDetailSchedule").addEventListener("click", markNewsEdited);
      detailSchedules.addEventListener("click", event => {
        if (event.target.closest(".remove-event")) markNewsEdited();
      }, true);
      els.generateBtn.addEventListener("click", generateStep1);
      els.step2Section.addEventListener("toggle", () => { if (els.step2Section.open) loadNews(); });
      document.getElementById("loadNews").onclick = () => loadNews(true);
      els.openStep2Btn.onclick = () => {
        loadNews();
        els.step2Section.open = true;
        els.step2Section.scrollIntoView({ behavior: "smooth" });
      };
      els.generateStep2Btn.addEventListener("click", generateStep2);
      els.copyStep2Btn.addEventListener("click", () => copyText(els.step2Output.textContent || ""));
      els.addOverlapBtn.addEventListener("click", addOverlapCard);
    }

    function vehicleDestination(value) {
      // Keep the facility and branch name. Remove only a recognizable room or floor suffix.
      const location = value.trim().replace(/\s*\((?:B\d+|무빈소|[^()]*빈소이동[^()]*)\)\s*$/i, "");
      const room = /\s*(?:[,·-]\s*)?(?:\(\s*)?(?:(?:지하\s*|B)?\d+\s*층\s*)?(?:(?:(?:VIP|특별|특실|특|일반|국화|목련|매화|백합|장궁|효)\s*)?(?:제\s*)?(?:[AB]?\d+|[AB])\s*(?:호실|호|분향소|분향실|빈소|실)|(?:VIP|특별|특|일반|국화|목련|매화|백합|장궁)실)(?:\s*특실)?\s*\)?$/i;
      const withoutRoom = location.replace(room, "").trimEnd();
      // Bare room numbers and abbreviated names are common immediately after a facility name.
      return withoutRoom.replace(/(장례식장|장례문화원|추모관|마루공원|병원|장례문화센터|장례원)\s*(?:(?:지하\s*|B)?\d+\s*층\s*)?(?:VIP|특실|특|백합|접객실)?\s*\d*$/i, "$1").trim();
    }

    function bindVehicleForm() {
      const panel = document.getElementById("vehicle");
      const form = document.getElementById("vehicleForm");
      const fields = form.elements;
      const trip = document.getElementById("trip");
      const result = document.getElementById("vehicleResult");
      const output = document.getElementById("vehicleText");
      let trips = [];
      let previousSource = null;

      function applyTrip() {
        const event = trip.value === "" ? null : trips[Number(trip.value)];
        fields.date.value = event?.date || "";
        fields.departure.value = event ? formatTimeLong(parseTime(event.time)) : "";
        fields.arrival.value = "";
        fields.destination.value = vehicleDestination(event?.place || "") || vehicleDestination(els.funeralHall.value);
        result.classList.add("hidden");
      }

      function loadTrips() {
        // A standalone request can be prepared while funeral schedules are incomplete.
        try {
          trips = readSchedules(schedules).filter(event => event.depart);
        } catch {
          trips = [];
        }
        const district = normalizeDistrictName(els.districtName.value);
        const source = JSON.stringify([trips, district, els.funeralHall.value.trim()]);
        if (source === previousSource) return;
        previousSource = source;
        trip.replaceChildren(new Option("직접 입력", ""));
        trips.forEach((event, index) => {
          trip.add(new Option(event.kind + " · " + formatLongDate(event.date) + " " + formatTimeLong(parseTime(event.time)), index));
        });
        if (trips.length) trip.value = "0";
        document.getElementById("tripField").classList.toggle("hidden", !trips.length);
        fields.department.value = district && !/(부|팀|교구)$/.test(district) ? district + "교구" : district;
        applyTrip();
      }

      panel.addEventListener("toggle", () => { if (panel.open) loadTrips(); });
      document.getElementById("openVehicle").onclick = () => {
        loadTrips();
        panel.open = true;
        panel.scrollIntoView({ behavior: "smooth" });
      };
      trip.onchange = applyTrip;
      form.addEventListener("input", () => result.classList.add("hidden"));
      form.addEventListener("submit", event => {
        event.preventDefault();
        result.classList.add("hidden");
        try {
          const value = key => fields.namedItem(key).value.trim();
          for (const field of form.querySelectorAll("[required]")) {
            if (!field.value.trim()) throw new Error(field.labels[0].textContent + " 항목을 입력해 주세요.");
          }
          const destination = vehicleDestination(value("destination"));
          if (!destination) throw new Error("행선지에 장례식장 이름을 입력해 주세요.");
          const date = parseLocalDate(value("date"));
          const departure = formatTimeLong(parseTime(normalizeTime(value("departure"), "교회출발")));
          const arrival = formatTimeLong(parseTime(normalizeTime(value("arrival"), "도착")));
          output.textContent = [
            "팀장님 차량 신청 부탁드립니다.", "",
            `날짜 : ${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`,
            `교회출발시간: ${departure}, 도착시간: ${arrival}`,
            `사용부서 및 탑승인원 : ${value("department")} ${value("passengers")}명`,
            `사용목적: ${value("purpose")}`,
            `행선지 : ${destination}`,
            `신청인 : ${value("applicant")} (${value("phone")})`
          ].join("\n");
          result.classList.remove("hidden");
        } catch (error) {
          alert(error.message);
        }
      });
      document.getElementById("copyVehicle").onclick = () => copyText(output.textContent);
    }

    function init() {
      buildSelectOptions(els.title1, titleOptionsMain);
      buildSelectOptions(els.title2, titleOptionsSpouse);
      addSchedule(schedules);
      toggleMode("district");
      bindEvents();
      bindVehicleForm();
      const themeSelect = document.getElementById("themeChoice");
      themeSelect.value = themeChoice;
      themeSelect.addEventListener("change", () => {
        themeChoice = themeSelect.value;
        applyTheme();
        try { localStorage.setItem(themeKey, themeChoice); } catch { /* Session-only choice. */ }
      });
      function openLinkedPanel(hash) {
        if (hash === "#step2Section" || hash === "#vehicle") {
          document.getElementById(hash.slice(1)).open = true;
        }
      }
      document.querySelector(".task-links").addEventListener("click", event => {
        const link = event.target.closest("a");
        if (link) openLinkedPanel(link.hash);
      });
      window.addEventListener("hashchange", () => openLinkedPanel(location.hash));
      openLinkedPanel(location.hash);
    }

    init();
  </script>
